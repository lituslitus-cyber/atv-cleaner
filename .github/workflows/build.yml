name: Сборка Windows-программы

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Установка PyInstaller
        run: pip install pyinstaller==6.11.1

      - name: Скачивание ADB
        shell: pwsh
        run: |
          Invoke-WebRequest https://dl.google.com/android/repository/platform-tools-latest-windows.zip -OutFile pt.zip
          Expand-Archive pt.zip -DestinationPath pt
          New-Item -ItemType Directory platform-tools | Out-Null
          Copy-Item pt/platform-tools/adb.exe, pt/platform-tools/AdbWinApi.dll, pt/platform-tools/AdbWinUsbApi.dll platform-tools/
          platform-tools/adb.exe version

      - name: Сборка exe
        run: pyinstaller --onefile --windowed --name ATVCleaner --add-data "platform-tools;platform-tools" gui.py

      - name: Проверка, что модули собраны
        shell: pwsh
        run: |
          python -c "import gui, atv_cleaner"
          if (-not (Test-Path dist/ATVCleaner.exe)) { exit 1 }
          "{0:N1} МБ" -f ((Get-Item dist/ATVCleaner.exe).Length / 1MB)

      - uses: actions/upload-artifact@v5
        with:
          name: ATVCleaner
          path: dist/ATVCleaner.exe

      # Релиз называется по __version__ из atv_cleaner.py. Новая версия создаёт
      # новый релиз, та же версия обновляет exe в существующем.
      - name: Версия
        id: ver
        shell: pwsh
        run: |
          $v = python -c "import atv_cleaner; print(atv_cleaner.__version__)"
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Релиз
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: ATV Cleaner ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: dist/ATVCleaner.exe
