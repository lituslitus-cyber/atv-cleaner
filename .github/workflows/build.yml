name: Сборка Windows-программы

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Установка PyInstaller
        run: pip install pyinstaller==6.11.1 pillow==11.0.0

      - name: Скачивание ADB
        shell: pwsh
        run: |
          Invoke-WebRequest https://dl.google.com/android/repository/platform-tools-latest-windows.zip -OutFile pt.zip
          Expand-Archive pt.zip -DestinationPath pt
          New-Item -ItemType Directory platform-tools | Out-Null
          Copy-Item pt/platform-tools/adb.exe, pt/platform-tools/AdbWinApi.dll, pt/platform-tools/AdbWinUsbApi.dll platform-tools/
          platform-tools/adb.exe version

      # scrcpy (Apache 2.0) показывает экран ТВ. Свой adb у него не нужен:
      # программа передаёт ему путь к своему через переменную ADB.
      - name: Скачивание scrcpy
        shell: pwsh
        env:
          SCRCPY_VERSION: "3.3.4"
        run: |
          $v = $env:SCRCPY_VERSION
          Invoke-WebRequest "https://github.com/Genymobile/scrcpy/releases/download/v$v/scrcpy-win64-v$v.zip" -OutFile scrcpy.zip
          Expand-Archive scrcpy.zip -DestinationPath scrcpy-tmp
          New-Item -ItemType Directory scrcpy | Out-Null
          Copy-Item scrcpy-tmp/*/* scrcpy/ -Recurse
          Remove-Item scrcpy/adb.exe, scrcpy/AdbWinApi.dll, scrcpy/AdbWinUsbApi.dll -ErrorAction SilentlyContinue
          if (-not (Test-Path scrcpy/scrcpy.exe) -or -not (Test-Path scrcpy/scrcpy-server)) { exit 1 }
          Get-ChildItem scrcpy | Select-Object Name, Length | Format-Table -AutoSize

      - name: Значок и сведения о версии
        run: python tools/make_build_files.py

      - name: Сборка exe
        run: >-
          pyinstaller --onefile --windowed --name ATVCleaner
          --icon build/icon.ico --version-file build/version_info.txt
          --add-data "platform-tools;platform-tools" --add-data "scrcpy;scrcpy"
          --add-data "build/icon.ico;."
          --hidden-import device_db
          gui.py

      - name: Проверка, что модули собраны
        shell: pwsh
        run: |
          python -c "import gui, atv_cleaner, device_db; assert atv_cleaner.MODEL_DB"
          if (-not (Test-Path dist/ATVCleaner.exe)) { exit 1 }
          "{0:N1} МБ" -f ((Get-Item dist/ATVCleaner.exe).Length / 1MB)
          $vi = (Get-Item dist/ATVCleaner.exe).VersionInfo
          "Свойства exe: $($vi.ProductName) $($vi.ProductVersion), $($vi.FileDescription), $($vi.CompanyName)"
          if (-not $vi.ProductName) { exit 1 }

      - uses: actions/upload-artifact@v5
        with:
          name: ATVCleaner
          path: dist/ATVCleaner.exe

      # Обычный пуш только проверяет сборку: exe лежит в артефактах запуска.
      # Релиз создаётся, только когда в сообщении коммита есть [release]
      # или сборка запущена вручную (Actions -> Run workflow).
      - name: Версия и заметки
        id: ver
        if: contains(github.event.head_commit.message, '[release]') || github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $v = python -c "import atv_cleaner; print(atv_cleaner.__version__)"
          "version=$v" >> $env:GITHUB_OUTPUT
          python -c "import re,sys; t=open('CHANGELOG.md',encoding='utf-8').read(); m=re.search(r'^## ' + re.escape(sys.argv[1]) + r'\b.*?\n(.*?)(?=^## |\Z)', t, re.S | re.M); open('notes.md','w',encoding='utf-8').write(m.group(1).strip() if m else '')" $v

      - name: Релиз
        if: steps.ver.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: ATV Cleaner ${{ steps.ver.outputs.version }}
          body_path: notes.md
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: dist/ATVCleaner.exe
